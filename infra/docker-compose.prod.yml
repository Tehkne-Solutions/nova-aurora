name: nova-aurora

x-app-environment: &app-environment
  NODE_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nova_aurora}
  POSTGRES_USER: ${POSTGRES_USER:-nova_aurora}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
  APP_VERSION: ${APP_VERSION:-development}
  GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app-secrets: &app-secrets
  - postgres_password
  - redis_password
  - internal_api_token

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_aurora}
      POSTGRES_USER: ${POSTGRES_USER:-nova_aurora}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_aurora} -d ${POSTGRES_DB:-nova_aurora}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      BOOTSTRAP_BOB_PASSWORD_FILE: /run/secrets/bootstrap_bob_password
      ENABLE_BOB_IN_PRODUCTION: ${ENABLE_BOB_IN_PRODUCTION:-false}
    secrets:
      - postgres_password
      - redis_password
      - internal_api_token
      - bootstrap_admin_password
      - bootstrap_bob_password
    command: ["node", "infra/docker/migrate-and-secure.mjs"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-environment
      API_PORT: "4000"
      WEB_ORIGINS: https://${DOMAIN:?DOMAIN obrigatório}
      TRUST_PROXY: "true"
    secrets: *app-secrets
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_HEALTH_PORT: "4010"
      ECONOMY_TICK_SECONDS: ${ECONOMY_TICK_SECONDS:-60}
    secrets: *app-secrets
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?DOMAIN obrigatório}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?DOMAIN obrigatório}
      APP_VERSION: ${APP_VERSION:-development}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - internal_api_token
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana:12.3.2
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: ops.${DOMAIN:?DOMAIN obrigatório}
      GF_SERVER_ROOT_URL: https://ops.${DOMAIN:?DOMAIN obrigatório}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nova_aurora}
      POSTGRES_USER: ${POSTGRES_USER:-nova_aurora}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command: ["/bin/sh", "/opt/nova-aurora/backup.sh"]
    secrets:
      - postgres_password
    volumes:
      - ./backup:/opt/nova-aurora:ro
      - backup_data:/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN obrigatório}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL obrigatório}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      grafana:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password.txt
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password.txt
  internal_api_token:
    file: ${SECRETS_DIR:-./secrets}/internal_api_token.txt
  bootstrap_admin_password:
    file: ${SECRETS_DIR:-./secrets}/bootstrap_admin_password.txt
  bootstrap_bob_password:
    file: ${SECRETS_DIR:-./secrets}/bootstrap_bob_password.txt
  grafana_admin_password:
    file: ${SECRETS_DIR:-./secrets}/grafana_admin_password.txt

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backup_data:
  caddy_data:
  caddy_config:
