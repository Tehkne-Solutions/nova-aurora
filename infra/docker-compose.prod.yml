name: nova-aurora

x-app-environment: &app-environment
  NODE_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nova_aurora}
  POSTGRES_USER: ${POSTGRES_USER:-nova_aurora}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
  DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
  TRANSACTIONAL_EMAIL_TOKEN_FILE: /run/secrets/transactional_email_token
  OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/object_storage_access_key
  OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/object_storage_secret_key
  OBJECT_STORAGE_UPLOAD_SIGNING_KEY_FILE: /run/secrets/object_storage_upload_signing_key
  OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://object-storage:8333}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-nova-aurora-ugc}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
  MALWARE_SCAN_HOST: ${MALWARE_SCAN_HOST:-clamav}
  MALWARE_SCAN_PORT: ${MALWARE_SCAN_PORT:-3310}
  MALWARE_SCAN_TIMEOUT_MS: ${MALWARE_SCAN_TIMEOUT_MS:-30000}
  ALLOW_RECOVERY_TOKEN_RESPONSE: "false"
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://${DOMAIN:?DOMAIN obrigatório}}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.${DOMAIN:?DOMAIN obrigatório}}
  PUBLIC_REGISTRATION_MODE: ${PUBLIC_REGISTRATION_MODE:-invite-only}
  TRANSACTIONAL_EMAIL_ENDPOINT: ${TRANSACTIONAL_EMAIL_ENDPOINT:?TRANSACTIONAL_EMAIL_ENDPOINT obrigatório}
  TRANSACTIONAL_EMAIL_FROM: ${TRANSACTIONAL_EMAIL_FROM:?TRANSACTIONAL_EMAIL_FROM obrigatório}
  APP_VERSION: ${APP_VERSION:-development}
  GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app-secrets: &app-secrets
  - postgres_password
  - redis_password
  - internal_api_token
  - data_encryption_key
  - transactional_email_token
  - object_storage_access_key
  - object_storage_secret_key
  - object_storage_upload_signing_key

x-node-runtime: &node-runtime
  restart: unless-stopped
  networks: [backend]
  secrets: *app-secrets
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_aurora}
      POSTGRES_USER: ${POSTGRES_USER:-nova_aurora}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_aurora} -d ${POSTGRES_DB:-nova_aurora}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)"
    secrets: [redis_password]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt: ["no-new-privileges:true"]

  object-storage:
    image: chrislusf/seaweedfs:4.29
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/object_storage_access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/object_storage_secret_key)"
        export S3_BUCKET="${OBJECT_STORAGE_BUCKET:-nova-aurora-ugc}"
        exec weed mini -dir=/data
    secrets:
      - object_storage_access_key
      - object_storage_secret_key
    volumes: [object_storage_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    volumes: [clamav_signatures:/var/lib/clamav]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      BOOTSTRAP_BOB_PASSWORD_FILE: /run/secrets/bootstrap_bob_password
      ENABLE_BOB_IN_PRODUCTION: ${ENABLE_BOB_IN_PRODUCTION:-false}
    secrets:
      - postgres_password
      - redis_password
      - internal_api_token
      - data_encryption_key
      - transactional_email_token
      - object_storage_access_key
      - object_storage_secret_key
      - object_storage_upload_signing_key
      - bootstrap_admin_password
      - bootstrap_bob_password
    command: ["node", "infra/docker/migrate-and-secure.mjs"]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    <<: *node-runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
      API_PORT: "4000"
      WEB_ORIGINS: https://${DOMAIN:?DOMAIN obrigatório}
      TRUST_PROXY: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *node-runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
      WORKER_HEALTH_PORT: "4010"
      ECONOMY_TICK_SECONDS: ${ECONOMY_TICK_SECONDS:-60}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    restart: unless-stopped
    image: ${IMAGE_REGISTRY:-ghcr.io/tehkne-solutions}/nova-aurora-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?DOMAIN obrigatório}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?DOMAIN obrigatório}
      APP_VERSION: ${APP_VERSION:-development}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [internal_api_token]
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: ops.${DOMAIN:?DOMAIN obrigatório}
      GF_SERVER_ROOT_URL: https://ops.${DOMAIN:?DOMAIN obrigatório}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [backend]
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nova_aurora}
      POSTGRES_USER: ${POSTGRES_USER:-nova_aurora}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command: ["/bin/sh", "/opt/nova-aurora/backup.sh"]
    secrets: [postgres_password]
    volumes:
      - ./backup:/opt/nova-aurora:ro
      - backup_data:/backups
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN obrigatório}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL obrigatório}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      grafana: { condition: service_started }
    security_opt: ["no-new-privileges:true"]

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password.txt
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password.txt
  internal_api_token:
    file: ${SECRETS_DIR:-./secrets}/internal_api_token.txt
  data_encryption_key:
    file: ${SECRETS_DIR:-./secrets}/data_encryption_key.txt
  transactional_email_token:
    file: ${SECRETS_DIR:-./secrets}/transactional_email_token.txt
  bootstrap_admin_password:
    file: ${SECRETS_DIR:-./secrets}/bootstrap_admin_password.txt
  bootstrap_bob_password:
    file: ${SECRETS_DIR:-./secrets}/bootstrap_bob_password.txt
  grafana_admin_password:
    file: ${SECRETS_DIR:-./secrets}/grafana_admin_password.txt
  object_storage_access_key:
    file: ${SECRETS_DIR:-./secrets}/object_storage_access_key.txt
  object_storage_secret_key:
    file: ${SECRETS_DIR:-./secrets}/object_storage_secret_key.txt
  object_storage_upload_signing_key:
    file: ${SECRETS_DIR:-./secrets}/object_storage_upload_signing_key.txt

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  clamav_signatures:
  prometheus_data:
  grafana_data:
  backup_data:
  caddy_data:
  caddy_config:
