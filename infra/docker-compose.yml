services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nova_aurora
      POSTGRES_USER: nova_aurora
      POSTGRES_PASSWORD: nova_aurora
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_aurora -d nova_aurora"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  object-storage:
    image: chrislusf/seaweedfs:4.29
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: nova-aurora-dev
      AWS_SECRET_ACCESS_KEY: nova-aurora-dev-secret-key-1234567890
      S3_BUCKET: nova-aurora-ugc
    ports: ["8333:8333"]
    volumes: ["object_storage_data:/data"]
volumes:
  postgres_data:
  redis_data:
  object_storage_data:
