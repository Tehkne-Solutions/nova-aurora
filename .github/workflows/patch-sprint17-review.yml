name: Patch Sprint 17 review fixes

on:
  push:
    branches:
      - agent/sprint-17-moderation-controlled-beta
    paths:
      - .github/workflows/patch-sprint17-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/sprint-17-moderation-controlled-beta
      - name: Apply typed approval fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/controlled-beta.ts')
          source = path.read_text()
          old = '''      const wave = rows[0]
                ? { ...rows[0], members: Number(memberRows[0]?.members ?? 0) }
                : undefined;
              if (!wave || String(wave.status) !== "planned") {'''
          if old not in source:
              old = '''      const wave = rows[0]
                ? { ...rows[0], members: Number(memberRows[0]?.members ?? 0) }
                : undefined;
              if (!wave || String(wave.status) !== "planned") {'''
          # Whitespace-independent fallback matching the committed source.
          if old not in source:
              old = '''      const wave = rows[0]
        ? { ...rows[0], members: Number(memberRows[0]?.members ?? 0) }
        : undefined;
      if (!wave || String(wave.status) !== "planned") {'''
          new = '''      const wave = rows[0] as Record<string, unknown> | undefined;
      const members = Number(memberRows[0]?.members ?? 0);
      if (!wave || String(wave.status) !== "planned") {'''
          if old not in source:
              raise SystemExit('approval inference block not found')
          source = source.replace(old, new, 1)
          source = source.replace(
              '      if (Number(memberRows[0]?.members ?? 0) < 1) {',
              '      if (members < 1) {',
              1
          )
          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          git config user.name "Tehkné Solutions Automation"
          git config user.email "automation@tehkne.solutions"
          git add packages/database/src/controlled-beta.ts
          git commit -m "fix(sprint17): type wave approval row safely"
          git push origin HEAD:agent/sprint-17-moderation-controlled-beta
