name: Sprint 13 privacy export fix

on:
  push:
    branches: [agent/economy-integrity-compliance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economy-integrity-compliance
          fetch-depth: 0
      - name: Fix ledger export timestamp
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/privacy-compliance.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'SELECT entry.id,entry.transaction_id,entry.amount_minor,entry.memo,entry.created_at,\n            account.code account_code\n          FROM ledger_entries entry\n          JOIN ledger_accounts account ON account.id=entry.account_id\n          WHERE account.owner_id=${identity.userId}::uuid\n          ORDER BY entry.created_at DESC LIMIT 10000',
              'SELECT entry.id,entry.transaction_id,entry.amount_minor,entry.memo,\n            ledger_transaction.created_at,account.code account_code\n          FROM ledger_entries entry\n          JOIN ledger_accounts account ON account.id=entry.account_id\n          JOIN ledger_transactions ledger_transaction ON ledger_transaction.id=entry.transaction_id\n          WHERE account.owner_id=${identity.userId}::uuid\n          ORDER BY ledger_transaction.created_at DESC LIMIT 10000'
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sprint13-export-fix.yml
      - name: Commit export fix
        run: |
          git config user.name "Tehkné Solutions CI"
          git config user.email "ci@tehkne.solutions"
          git add packages/database/src/privacy-compliance.ts .github/workflows/sprint13-export-fix.yml
          git commit -m "fix: export ledger entry time from parent transaction"
          git push origin HEAD:agent/economy-integrity-compliance
