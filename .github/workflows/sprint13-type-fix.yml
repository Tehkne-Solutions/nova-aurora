name: Sprint 13 type fix

on:
  push:
    branches: [agent/economy-integrity-compliance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economy-integrity-compliance
          fetch-depth: 0
      - name: Rename private helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/strong-identity.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('this.rolesFor(tx, userId)', 'this.strongIdentityRolesFor(tx, userId)')
          text = text.replace('private async rolesFor(tx: Tx, userId: string)', 'private async strongIdentityRolesFor(tx: Tx, userId: string)')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sprint13-type-fix.yml
      - name: Commit strict type fix
        run: |
          git config user.name "Tehkné Solutions CI"
          git config user.email "ci@tehkne.solutions"
          git add packages/database/src/strong-identity.ts .github/workflows/sprint13-type-fix.yml
          git commit -m "fix: isolate strong identity private helper"
          git push origin HEAD:agent/economy-integrity-compliance
