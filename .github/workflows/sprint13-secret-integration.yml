name: Sprint 13 secret integration

on:
  push:
    branches: [agent/economy-integrity-compliance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economy-integrity-compliance
          fetch-depth: 0
      - name: Integrate encryption secret
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path('infra/docker-compose.prod.yml')
          text = compose.read_text(encoding='utf-8')
          text = text.replace(
              '  INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token\n',
              '  INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token\n  DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key\n  ALLOW_RECOVERY_TOKEN_RESPONSE: "false"\n'
          )
          text = text.replace(
              '  - internal_api_token\n',
              '  - internal_api_token\n  - data_encryption_key\n',
              1
          )
          text = text.replace(
              '  bootstrap_admin_password:\n',
              '  data_encryption_key:\n    file: ${SECRETS_DIR:-./secrets}/data_encryption_key.txt\n  bootstrap_admin_password:\n'
          )
          compose.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          text = text.replace(
              'postgres_password redis_password internal_api_token bootstrap_admin_password',
              'postgres_password redis_password internal_api_token data_encryption_key bootstrap_admin_password'
          )
          ci.write_text(text, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-production.yml')
          text = deploy.read_text(encoding='utf-8')
          text = text.replace(
              'postgres_password redis_password internal_api_token bootstrap_admin_password',
              'postgres_password redis_password internal_api_token data_encryption_key bootstrap_admin_password'
          )
          deploy.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sprint13-secret-integration.yml
      - name: Commit deployment integration
        run: |
          git config user.name "Tehkné Solutions CI"
          git config user.email "ci@tehkne.solutions"
          git add infra/docker-compose.prod.yml .github/workflows/ci.yml .github/workflows/deploy-production.yml .github/workflows/sprint13-secret-integration.yml
          git commit -m "feat: add dedicated compliance encryption secret to production"
          git push origin HEAD:agent/economy-integrity-compliance
