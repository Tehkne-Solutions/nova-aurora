name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nova_aurora
          POSTGRES_USER: nova_aurora
          POSTGRES_PASSWORD: nova_aurora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova_aurora -d nova_aurora"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nova_aurora:nova_aurora@localhost:5432/nova_aurora
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_TOKEN: 123456789012345678901234
      DATA_ENCRYPTION_KEY: ci-data-encryption-key-12345678901234567890
      ALLOW_RECOVERY_TOKEN_RESPONSE: "true"
      PUBLIC_WEB_URL: http://localhost:3000
      PUBLIC_API_URL: https://api.nova-aurora.example.com
      PUBLIC_REGISTRATION_MODE: open
      TRANSACTIONAL_EMAIL_FROM: Nova Aurora CI <no-reply@nova-aurora.local>
      TRANSACTIONAL_EMAIL_TOKEN: ci-transactional-email-token-1234567890
      WEB_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:8333
      OBJECT_STORAGE_BUCKET: nova-aurora-ugc
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: nova-aurora-ci
      OBJECT_STORAGE_SECRET_KEY: ci-object-storage-secret-key-1234567890
      OBJECT_STORAGE_UPLOAD_SIGNING_KEY: ci-upload-signing-key-12345678901234567890
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Start S3-compatible object storage
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --name nova-aurora-storage-ci \
            -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$OBJECT_STORAGE_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$OBJECT_STORAGE_SECRET_KEY" \
            -e S3_BUCKET="$OBJECT_STORAGE_BUCKET" \
            chrislusf/seaweedfs:4.29 mini -dir=/data
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:8333/; then
              exit 0
            fi
            sleep 1
          done
          docker logs nova-aurora-storage-ci || true
          exit 1

      - run: pnpm db:migrate

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log

      - name: Build application
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log

      - name: Start release candidate services
        shell: bash
        run: |
          set -Eeuo pipefail
          nohup pnpm --filter @nova-aurora/api start > api-smoke.log 2>&1 &
          echo $! > api-smoke.pid
          nohup pnpm --filter @nova-aurora/web start > web-smoke.log 2>&1 &
          echo $! > web-smoke.pid
          for attempt in $(seq 1 60); do
            api_ready=false
            web_ready=false
            curl --fail --silent http://127.0.0.1:4000/health >/dev/null && api_ready=true || true
            curl --fail --silent http://127.0.0.1:3000/login >/dev/null && web_ready=true || true
            if [ "$api_ready" = true ] && [ "$web_ready" = true ]; then
              exit 0
            fi
            sleep 1
          done
          cat api-smoke.log || true
          cat web-smoke.log || true
          exit 1

      - name: Verified manifest upload gate
        env:
          API_URL: http://127.0.0.1:4000
          VERIFIED_UPLOAD_QA_REPORT: verified-upload-report.json
        run: node infra/qa/verified-upload-smoke.mjs

      - name: Browser E2E and accessibility gate
        env:
          API_URL: http://127.0.0.1:4000
          WEB_URL: http://127.0.0.1:3000
          RELEASE_QA_REPORT: release-browser-report.json
        run: node infra/qa/browser-e2e.mjs

      - name: Concurrent load smoke gate
        env:
          API_URL: http://127.0.0.1:4000
          WEB_URL: http://127.0.0.1:3000
          LOAD_QA_REPORT: release-load-report.json
          LOAD_CONCURRENCY: 20
          LOAD_REQUESTS_PER_TARGET: 80
          LOAD_P95_LIMIT_MS: 2500
        run: node infra/qa/load-smoke.mjs

      - name: Upload release QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa-evidence
          path: |
            verified-upload-report.json
            release-browser-report.json
            release-load-report.json
            api-smoke.log
            web-smoke.log
          if-no-files-found: ignore

      - name: Stop release candidate services
        if: always()
        run: |
          test -f api-smoke.pid && kill "$(cat api-smoke.pid)" || true
          test -f web-smoke.pid && kill "$(cat web-smoke.pid)" || true

      - name: Validate scripts and dashboards
        run: |
          node --check infra/docker/runtime-secrets.mjs
          node --check infra/docker/run-service.mjs
          node --check infra/docker/migrate-and-secure.mjs
          node --check infra/qa/browser-e2e.mjs
          node --check infra/qa/load-smoke.mjs
          node --check infra/qa/verified-upload-smoke.mjs
          sh -n infra/backup/backup.sh
          sh -n infra/backup/restore.sh
          sh -n infra/backup/verify.sh
          node -e "JSON.parse(require('node:fs').readFileSync('infra/grafana/dashboards/nova-aurora-operations.json','utf8'))"

      - name: Validate production Compose
        run: |
          mkdir -p infra/secrets
          for secret in postgres_password redis_password internal_api_token data_encryption_key transactional_email_token bootstrap_admin_password bootstrap_bob_password grafana_admin_password object_storage_access_key object_storage_secret_key object_storage_upload_signing_key; do
            printf 'ci-%s-123456789012345678901234567890\n' "$secret" > "infra/secrets/$secret.txt"
          done
          docker compose --env-file .env.production.example -f infra/docker-compose.prod.yml config > compose.resolved.yml

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=nova-aurora.example.com \
            -e ACME_EMAIL=infra@example.com \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.3-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            -v "$PWD/infra/secrets/internal_api_token.txt:/run/secrets/internal_api_token:ro" \
            prom/prometheus:v3.11.3 \
            check config /etc/prometheus/prometheus.yml

      - name: Build production images
        run: |
          docker build -f Dockerfile.api -t nova-aurora-api:ci .
          docker build -f Dockerfile.worker -t nova-aurora-worker:ci .
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.nova-aurora.example.com \
            -f Dockerfile.web -t nova-aurora-web:ci .

      - name: Create and verify database backup
        run: |
          mkdir -p "$RUNNER_TEMP/nova-aurora-backups" "$RUNNER_TEMP/nova-aurora-secrets"
          printf 'nova_aurora\n' > "$RUNNER_TEMP/nova-aurora-secrets/postgres_password"
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=nova_aurora \
            -e POSTGRES_USER=nova_aurora \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
            -e BACKUP_DIR=/backups \
            -e BACKUP_ONCE=true \
            -v "$PWD/infra/backup:/opt/nova-aurora:ro" \
            -v "$RUNNER_TEMP/nova-aurora-backups:/backups" \
            -v "$RUNNER_TEMP/nova-aurora-secrets/postgres_password:/run/secrets/postgres_password:ro" \
            postgres:17-alpine /bin/sh /opt/nova-aurora/backup.sh
          backup_file="$(find "$RUNNER_TEMP/nova-aurora-backups" -name '*.dump' -type f | head -n 1)"
          test -n "$backup_file"
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=nova_aurora \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
            -v "$PWD/infra/backup:/opt/nova-aurora:ro" \
            -v "$RUNNER_TEMP/nova-aurora-backups:/backups" \
            -v "$RUNNER_TEMP/nova-aurora-secrets/postgres_password:/run/secrets/postgres_password:ro" \
            postgres:17-alpine /bin/sh /opt/nova-aurora/verify.sh "/backups/$(basename "$backup_file")"

      - name: Capture object storage diagnostics
        if: failure()
        run: docker logs nova-aurora-storage-ci > object-storage-ci.log 2>&1 || true

      - name: Upload infrastructure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-diagnostics
          path: |
            compose.resolved.yml
            typecheck.log
            test.log
            build.log
            api-smoke.log
            web-smoke.log
            object-storage-ci.log

      - name: Stop object storage
        if: always()
        run: docker rm -f nova-aurora-storage-ci || true
