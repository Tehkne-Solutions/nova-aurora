name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nova_aurora
          POSTGRES_USER: nova_aurora
          POSTGRES_PASSWORD: nova_aurora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova_aurora -d nova_aurora"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nova_aurora:nova_aurora@localhost:5432/nova_aurora
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: 12345678901234567890123456789012
      INTERNAL_API_TOKEN: 123456789012345678901234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Materialize and commit Sprint 8
        if: hashFiles('.sprint8/chunk01') != ''
        shell: bash
        run: |
          set -uo pipefail
          files=(
            .sprint8/chunk01 .sprint8/chunk02 .sprint8/chunk03
            .sprint8/chunk04 .sprint8/chunk05 .sprint8/chunk06
            .sprint8/chunk07 .sprint8/chunk08 .sprint8/chunk09
            .sprint8/chunk10a .sprint8/chunk10b
            .sprint8/chunk11a .sprint8/chunk11b .sprint8/chunk12
          )
          {
            echo "Chunk diagnostics"
            for file in "${files[@]}"; do
              wc -c "$file"
              sha256sum "$file"
            done
          } > sprint8-materialization.log
          cat "${files[@]}" > /tmp/sprint8.b64
          {
            echo "Combined base64"
            wc -c /tmp/sprint8.b64
            sha256sum /tmp/sprint8.b64
          } >> sprint8-materialization.log
          base64 -d /tmp/sprint8.b64 > /tmp/sprint8.zip
          decode_status=$?
          {
            echo "Decoded archive status: $decode_status"
            wc -c /tmp/sprint8.zip
            sha256sum /tmp/sprint8.zip
          } >> sprint8-materialization.log
          cat sprint8-materialization.log
          actual_b64=$(sha256sum /tmp/sprint8.b64 | cut -d' ' -f1)
          actual_zip=$(sha256sum /tmp/sprint8.zip | cut -d' ' -f1)
          actual_size=$(wc -c < /tmp/sprint8.zip)
          if [ "$decode_status" -ne 0 ] || \
             [ "$actual_b64" != "e8c7374f70e34c8585d76c673825e19efb313efb8b9571ff7e9eb1db2b36be5a" ] || \
             [ "$actual_zip" != "3fcbc4d112e2faedb98563e0dcd0d7d2ff524cca1bfe98d6e11a45426e18d2bf" ] || \
             [ "$actual_size" -ne 26793 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f sprint8-materialization.log
            git commit -m "chore: record Sprint 8 integrity diagnostics"
            git push origin HEAD:${GITHUB_HEAD_REF}
            exit 1
          fi
          unzip -o /tmp/sprint8.zip
          rm -rf .sprint8 sprint8-materialization.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement regional economy and business management"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:migrate
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
      - run: pnpm build
