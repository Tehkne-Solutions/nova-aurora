name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nova_aurora
          POSTGRES_USER: nova_aurora
          POSTGRES_PASSWORD: nova_aurora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova_aurora -d nova_aurora"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nova_aurora:nova_aurora@localhost:5432/nova_aurora
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: 12345678901234567890123456789012
      INTERNAL_API_TOKEN: 123456789012345678901234
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fix Sprint 8 stock mapping
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^        reorderPoint,$/        reorderPoint: Number(row.reorder_point),/' packages/database/src/regional-business-management.ts
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/regional-business-management.ts .github/workflows/ci.yml
          git commit -m "fix: map regional stock reorder point"
          git push origin HEAD:agent/regional-economy-business-management
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:migrate
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
      - run: pnpm build
