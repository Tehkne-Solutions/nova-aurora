name: Generate pnpm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'agent/public-deployment-observability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: rm .github/workflows/generate-lockfile.yml
      - name: Commit lockfile
        run: |
          git config user.name "Tehkné Solutions CI"
          git config user.email "ci@tehkne.solutions"
          git add pnpm-lock.yaml .github/workflows/generate-lockfile.yml
          git commit -m "build: add reproducible pnpm lockfile"
          git push origin HEAD:${{ github.head_ref }}
