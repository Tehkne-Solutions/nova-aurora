name: Sprint 11 strict optional fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/identity-security-live-city'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact optional property fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('packages/database/src/auth-security.ts'),
              Path('packages/database/src/live-security.ts'),
          ]
          replacements = {
              'ipAddress?: string;': 'ipAddress?: string | undefined;',
              'userAgent?: string;': 'userAgent?: string | undefined;',
              'deviceName?: string;': 'deviceName?: string | undefined;',
              'sessionId?: string;': 'sessionId?: string | undefined;',
              'resourceType?: string;': 'resourceType?: string | undefined;',
              'resourceId?: string;': 'resourceId?: string | undefined;',
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sprint11-type-fix.yml
      - name: Commit fixes
        run: |
          git config user.name "Tehkné Solutions CI"
          git config user.email "ci@tehkne.solutions"
          git add packages/database/src/auth-security.ts packages/database/src/live-security.ts .github/workflows/sprint11-type-fix.yml
          git commit -m "fix: align security types with strict optional properties"
          git push origin HEAD:${{ github.head_ref }}
