name: Bootstrap Nova Aurora

on:
  push:
    branches:
      - agent/bootstrap-persistent-economy
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-nova-aurora
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-persistent-economy
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive.part* > /tmp/nova-aurora.b64
          base64 --decode /tmp/nova-aurora.b64 > /tmp/nova-aurora.zip
          echo 'bcabd5156f45db2c25942fcf08c1fc614cfddb71efab21033f1618ff88af3376  /tmp/nova-aurora.zip' | sha256sum --check --strict
          mkdir -p /tmp/nova-aurora-import
          unzip -q /tmp/nova-aurora.zip -d /tmp/nova-aurora-import

      - name: Materialize monorepo
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' /tmp/nova-aurora-import/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: bootstrap Nova Aurora persistent economy'
          git push origin HEAD:agent/bootstrap-persistent-economy
